name: 'Backend CI/CD'

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/ie-bank-backend.yml'

env:
  BACKEND_WEBAPP_DEV: sbrennerascbackend
  IMAGE_NAME: sbrennerascbackend
  REGISTRY_USERNAME: sbrenneracr

jobs:
  build:
    
    runs-on: ubuntu-latest
    env:
      ENV: ghci

    steps:
      - uses: actions/checkout@main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r ./backend/requirements.txt

      - name: Lint with flake8
        working-directory: ./backend
        run: |
          pip install flake8 pytest
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Test with pytest
        working-directory: ./backend
        run: |
          python -m pytest --cov=iebank_api -v
      
      - name: 'Login to Azure Container Registry'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_USERNAME }}.azurecr.io
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD1 }}
      
      # GitHub action - Write step to set your docker image version
      # You can use the environment variable IMAGE_NAME
      - name: 'Setting your docker image version'
        run: |
            docker build ./backend -t ${{ env.REGISTRY_USERNAME }}.azurecr.io/${{ env.IMAGE_NAME }}-dev
            docker tag ${{ env.REGISTRY_USERNAME }}.azurecr.io/${{ env.IMAGE_NAME }}-dev ${{ env.REGISTRY_USERNAME }}.azurecr.io/${{ env.IMAGE_NAME }}-dev:${{ github.sha }}
            docker push ${{ env.REGISTRY_USERNAME }}.azurecr.io/${{ env.IMAGE_NAME }}-dev:${{ github.sha }}
            docker push ${{ env.REGISTRY_USERNAME }}.azurecr.io/${{ env.IMAGE_NAME }}-dev


      #Exercise IV
      # GitHub action: Write step to build and push your Docker image into the Container Registry

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'

    steps:
      # Exercise IV
      # GitHub action: Write step to login in to Azure.
      # You can use the repository secret AZURE_CREDENTIALS
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Exercise IV
      # GitHub action: Write step to set up the published container image for your Azure container web 
      - name: 'Set up the published container image for your Azure container web'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.BACKEND_WEBAPP_DEV }}
          images: ${{ env.REGISTRY_USERNAME }}.azurecr.io/${{ env.IMAGE_NAME }}-dev
