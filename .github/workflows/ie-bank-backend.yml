name: 'Backend Tests Only'

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/ie-bank-backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./backend

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get secrets from Key Vault
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: "sbrenner-kv" 
          secrets: "db-username,db-password,db-host,db-name"
        id: dbsecrets

      - name: Run integration tests with Azure PostgreSQL
        working-directory: ./backend
        run: |
          pip install pytest
          python -m pytest --cov=iebank_api -v
        env:
          DATABASE_URL: "postgresql://${{ steps.dbsecrets.outputs.db-username }}:${{ steps.dbsecrets.outputs.db-password }}@${{ steps.dbsecrets.outputs.db-host }}/${{ steps.dbsecrets.outputs.db-name }}"