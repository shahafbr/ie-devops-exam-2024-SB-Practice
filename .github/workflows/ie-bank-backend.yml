name: 'Backend Tests Only'

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/ie-bank-backend.yml'

jobs:
  build:
    
    runs-on: ubuntu-latest
    env:
      ENV:  dev
      ACR_NAME_DEV: sbrenneracr

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip
        
      - name: Install dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
        

      - name: Lint with flake8
        working-directory: ./backend
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
          

      - name: Test with pytest
        working-directory: ./backend
        run: |
          pip install pytest
          export DATABASE_URL="postgresql://${{ secrets.DBUSER }}:${{ secrets.DBPASS }}@${{ env.DBHOST }}.postgres.database.azure.com/${{ env.DBNAME }}"
          python -m pytest --cov=iebank_api -v
        env:
          DBHOST: sbrenner-dbsrv
          DBNAME: sbrenner-db
        
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
            name: python-app
            path: |
              .